<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOW · Animación</title>
<style>
:root{--bg:#151514;--panel:#1b1a19;--panel2:#232220;--hover:#302f2c;--line:rgba(255,248,235,.075);--txt:#eeeae2;--mut:#aaa59c;--orange:#df6c48;--cyan:#67aeb6;--cell:28px}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:"Segoe UI Variable","Segoe UI",Arial,sans-serif;font-size:13px}
body{display:flex;flex-direction:column}.top{height:54px;flex:none;display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:.08em}.mode{color:var(--mut);font-size:11px;font-weight:650;letter-spacing:.06em}.spacer{flex:1}button{height:36px;min-width:36px;border:0;border-radius:10px;background:transparent;color:var(--mut);cursor:pointer;font-size:14px}button:hover{background:var(--hover);color:var(--txt)}button.primary{padding:0 12px;background:rgba(223,108,72,.14);color:var(--orange)}.fps{font-size:11px;color:var(--mut)}
.viewport{flex:1;overflow:auto;position:relative}.timeline{min-width:max-content}.head,.row{display:flex;min-height:var(--cell)}.head{position:sticky;top:0;z-index:4;background:var(--panel2)}
.label{position:sticky;left:0;z-index:3;width:190px;flex:none;padding:6px 10px;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.head .label{z-index:6;background:var(--panel2);font-weight:700}
.cell{width:var(--cell);height:var(--cell);flex:none;border-right:1px solid #24242a;border-bottom:1px solid #24242a;position:relative;text-align:center;font:10px/26px Consolas,monospace;color:var(--mut);cursor:pointer}.cell:hover{background:#26262c}.cell.current{box-shadow:inset 1px 0 var(--orange),inset -1px 0 var(--orange);background:#311911;color:#fff}.cell.start{background:var(--cyan);color:#071014}.cell.hold::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(51,181,232,.55)}.cell.future{opacity:.42}.cell.key::before{content:"◆";color:#ffad32;font-size:7px}.cell.camera::after{content:"●";color:var(--cyan);font-size:7px;position:absolute;bottom:-7px;left:10px}
.xsheet .row{min-height:30px}.xsheet .cell{width:92px;height:30px;line-height:30px}.xsheet .label{width:64px;text-align:right;font-family:Consolas,monospace}.empty{padding:30px;color:var(--mut)}
.lst{display:flex;flex-direction:column}
.lpc{font-size:10px;opacity:.55;min-width:32px;text-align:right}
.lrow{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.lrow:hover{background:var(--hover)}.lrow.sel{background:rgba(223,108,72,.16)}
.lname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{height:22px;min-width:22px;font-size:12px}
.lrow input[type=range]{width:84px;accent-color:var(--orange)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:10px}
.tool{height:34px;padding:0 10px;border-radius:8px;background:var(--panel2);color:var(--txt);text-align:left;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool.on{background:rgba(223,108,72,.18);color:var(--orange)}
.pad{padding:14px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.frow label{color:var(--mut)}.frow input[type=color]{width:60px;height:30px;border:0;background:none}
.frow input[type=number]{width:80px;height:30px;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:0 8px}
</style>
</head>
<body>
<div class="top">
  <span class="brand">LOW</span><span class="mode" id="mode"></span>
  <button id="prev" title="Anterior">◀</button><button id="play" title="Reproducir">▶</button><button id="next" title="Siguiente">▶|</button><button id="add" title="Duplicar frame">＋</button><button id="blank" title="Agregar frame vacío">□＋</button>
  <span class="spacer"></span><span class="fps" id="fps"></span>
  <button class="primary" id="dock" title="Volver a acoplar este panel en LOW — o arrastrá esta ventana encima de LOW, como en Photoshop">Acoplar</button>
</div>
<div class="viewport"><div id="content" class="timeline"><div class="empty">Conectando con el editor…</div></div></div>
<script>
const KINDS={timeline:'TIMELINE',xsheet:'X-SHEET',layers:'CAPAS',tools:'HERRAMIENTAS',color:'COLOR',onion:'PAPEL CEBOLLA',levelstrip:'DIBUJOS DEL NIVEL'};
// el kind llega por FRAGMENTO (#kind=...): sobre file:// la query se pierde
// (WebView2 la toma como parte del nombre del archivo). Se acepta ?kind= igual,
// para cuando el panel se abre desde un servidor durante las pruebas.
const pedido=(location.hash.match(/kind=([a-z]+)/)||[])[1]
  ||new URLSearchParams(location.search).get('kind')||'timeline';
const kind=KINDS[pedido]?pedido:'timeline';
document.getElementById('mode').textContent=KINDS[kind];
const isAnim=kind==='timeline'||kind==='xsheet';
// los controles de reproducción solo tienen sentido en timeline/x-sheet
if(!isAnim)['prev','play','next','add','blank'].forEach(id=>document.getElementById(id).style.display='none');
let api=null,last='';
const command=(action,payload={})=>api&&(api.panel_command?api.panel_command(kind,action,payload):api.animation_panel_command(action,payload));
document.getElementById('prev').onclick=()=>command('previous');
document.getElementById('play').onclick=()=>command('play');
document.getElementById('next').onclick=()=>command('next');
document.getElementById('add').onclick=()=>command('add');
document.getElementById('blank').onclick=()=>command('add-blank');
document.getElementById('dock').onclick=async()=>{
 // window.close() NO cierra una ventana de pywebview: por eso "Acoplar" no
 // hacía nada. La cierra Python con close_panel(); el window.close() queda
 // como respaldo para cuando el panel se abre en un navegador de pruebas.
 if(api){
  await command('dock',{kind});
  if(api.close_panel){await api.close_panel(kind)}
  else{await (api.panel_closed?api.panel_closed(kind):api.animation_panel_closed(kind))}
 }
 window.close();
};
function cell(frame,classes='',text=''){
 const c=document.createElement('div');c.className='cell '+classes;c.textContent=text;
 c.onclick=()=>command('frame',{index:frame.index});c.ondblclick=()=>{if(!frame.exists)command('create-frame',{index:frame.index})};return c;
}
function renderTimeline(s){
 const root=document.createElement('div');root.className='timeline';
 const head=document.createElement('div');head.className='head';head.innerHTML='<div class="label">Niveles ↓ · Fotogramas →</div>';
 s.frames.forEach(f=>head.appendChild(cell(f,(f.index===s.current?'current ':'')+(f.exists?'':'future'),f.number%5===0||f.index===s.current?f.number:'')));root.appendChild(head);
 (s.levels||[]).forEach((level,li)=>{const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.className='label';label.textContent=level;row.appendChild(label);let prev=false;s.frames.forEach((f,i)=>{const on=!!(s.exposures[li]&&s.exposures[li][i]);row.appendChild(cell(f,(i===s.current?'current ':'')+(on?(prev?'hold':'start'):'')+(f.exists?'':' future')));prev=on});root.appendChild(row)});
 const cam=document.createElement('div');cam.className='row';cam.innerHTML='<div class="label">Cámara</div>';s.frames.forEach(f=>cam.appendChild(cell(f,(f.index===s.current?'current ':'')+(f.camera?'camera ':'')+(f.exists?'':'future'))));root.appendChild(cam);return root;
}
function renderXsheet(s){
 const root=document.createElement('div');root.className='timeline xsheet';const head=document.createElement('div');head.className='head';head.innerHTML='<div class="label">F</div>'+(s.levels||[]).map(x=>'<div class="cell">'+x.replace(/^#/,'')+'</div>').join('');root.appendChild(head);
 s.frames.filter(f=>f.exists).forEach((f,i)=>{const row=document.createElement('div');row.className='row';const label=document.createElement('div');label.className='label';label.textContent=f.number;row.appendChild(label);(s.levels||[]).forEach((level,li)=>{const on=s.exposures[li]&&s.exposures[li][i],prev=i&&s.exposures[li]&&s.exposures[li][i-1];row.appendChild(cell(f,(i===s.current?'current ':'')+(on?(prev?'hold':'start'):''),on&&!prev?f.number:''))});root.appendChild(row)});return root;
}
function renderLayers(s){
 const root=document.createElement('div');root.className='timeline lst';
 (s.layers||[]).forEach(l=>{
  const row=document.createElement('div');row.className='lrow'+(l.selected?' sel':'');
  const eye=document.createElement('button');eye.className='mini';eye.textContent=l.hidden?'◌':'◉';
  eye.title=l.hidden?'Mostrar':'Ocultar';if(l.hidden)eye.style.opacity='.4';
  eye.onclick=e=>{e.stopPropagation();command('visible',{id:l.id})};
  const lock=document.createElement('button');lock.className='mini';lock.textContent=l.locked?'◼':'◻';
  lock.title=l.locked?'Desbloquear':'Bloquear';if(!l.locked)lock.style.opacity='.35';
  lock.onclick=e=>{e.stopPropagation();command('lock',{id:l.id})};
  const name=document.createElement('span');name.className='lname';name.textContent=l.name;
  const op=document.createElement('input');op.type='range';op.min=0;op.max=100;op.value=l.opacity;
  op.title='Opacidad '+l.opacity+'%';op.oninput=e=>{e.stopPropagation();command('opacity',{id:l.id,value:+e.target.value})};
  const pc=document.createElement('span');pc.className='lpc';pc.textContent=l.opacity+'%';
  row.append(eye,lock,name,op,pc);row.onclick=()=>command('select',{id:l.id});root.appendChild(row)});
 if(!(s.layers||[]).length)root.innerHTML='<div class="empty">Sin capas todavía</div>';
 return root;
}
function renderTools(s){
 const root=document.createElement('div');root.className='timeline grid';
 (s.tools||[]).forEach(t=>{const b=document.createElement('button');
  b.className='tool'+(t.active?' on':'');b.textContent=t.label;b.title=t.label;
  b.onclick=()=>command('tool',{id:t.id});root.appendChild(b)});
 if(!(s.tools||[]).length)root.innerHTML='<div class="empty">Abrí un diseño en LOW</div>';
 return root;
}
function renderColor(s){
 const root=document.createElement('div');root.className='timeline pad';
 if(!s.hasSelection){root.innerHTML='<div class="empty">Elegí un elemento en el lienzo</div>';return root}
 const fila=(txt,inp)=>{const d=document.createElement('div');d.className='frow';
  const l=document.createElement('label');l.textContent=txt;d.append(l,inp);return d};
 const f=document.createElement('input');f.type='color';f.value=s.fill||'#000000';
 f.oninput=e=>command('fill',{value:e.target.value});
 const st=document.createElement('input');st.type='color';st.value=s.stroke||'#000000';
 st.oninput=e=>command('stroke',{value:e.target.value});
 const w=document.createElement('input');w.type='number';w.min=0;w.step=0.5;w.value=s.width||1;
 w.oninput=e=>command('width',{value:e.target.value});
 root.append(fila('Relleno',f),fila('Trazo',st),fila('Grosor',w));return root;
}
function renderLevelStrip(s){
 const root=document.createElement('div');root.className='timeline grid';
 (s.drawings||[]).forEach(d=>{const b=document.createElement('button');b.className='tool'+(d.number===s.current?' on':'');
  b.textContent='Dibujo '+d.number+(d.exposed?'':' · sin exponer');b.onclick=()=>command('drawing',{number:d.number});root.appendChild(b)});
 if(!(s.drawings||[]).length)root.innerHTML='<div class="empty">El nivel todavía no tiene dibujos</div>';return root;
}
/* PAPEL CEBOLLA en su propia ventana: los mismos controles que adentro, para
   dejarlo abierto en el segundo monitor mientras se dibuja en el primero. */
function renderOnion(s){
 const root=document.createElement('div');root.className='timeline pad';
 if(!s||!s.cfg){root.innerHTML='<div class="empty">Abrí una animación en LOW</div>';return root}
 const c=s.cfg;
 const fila=(txt,el)=>{const d=document.createElement('div');d.className='frow';
  const l=document.createElement('label');l.textContent=txt;d.append(l,el);return d};
 const lado=(txt,valor,color,key)=>{
  const box=document.createElement('div');box.style.cssText='display:flex;gap:4px';
  for(let i=1;i<=4;i++){const b=document.createElement('button');
   b.textContent=i;b.className='tool'+(i<=valor?' on':'');
   b.style.cssText='min-width:26px;padding:3px 0';
   b.onclick=()=>command('onion',{key,value:valor===i?i-1:i});box.appendChild(b)}
  const sw=document.createElement('i');
  sw.style.cssText=`width:4px;border-radius:2px;background:${color}`;
  box.prepend(sw);
  return fila(txt,box)};
 root.append(lado('Antes',c.before,c.colorBefore,'before'));
 root.append(lado('Después',c.after,c.colorAfter,'after'));
 const op=document.createElement('input');op.type='range';op.min=5;op.max=80;
 op.value=Math.round(c.alpha*100);
 op.oninput=e=>command('onion',{key:'alpha',value:+e.target.value/100});
 root.append(fila('Opacidad',op));
 const on=document.createElement('button');on.className='tool'+(s.enabled?' on':'');
 on.textContent=s.enabled?'Activado':'Desactivado';
 on.onclick=()=>command('onion',{key:'enabled',value:!s.enabled});
 root.append(fila('Estado',on));
 return root;
}
function renderFor(s){
 if(kind==='layers')return renderLayers(s);
 if(kind==='tools')return renderTools(s);
 if(kind==='color')return renderColor(s);
 if(kind==='onion')return renderOnion(s);
 if(kind==='levelstrip')return renderLevelStrip(s);
 return kind==='xsheet'?renderXsheet(s):renderTimeline(s);
}
async function refresh(){if(!api)return;try{const s=await (api.panel_state?api.panel_state(kind):api.animation_panel_state());const key=JSON.stringify(s);if(key===last)return;last=key;if(isAnim){document.getElementById('fps').textContent=(s.fps||12)+' FPS · '+(s.frames?s.frames.filter(f=>f.exists).length:0)+' frames';document.getElementById('play').textContent=s.playing?'Ⅱ':'▶';}const content=document.getElementById('content');const next=renderFor(s);next.id='content';content.replaceWith(next)}catch(e){}}
window.addEventListener('pywebviewready',()=>{api=window.pywebview.api;refresh();setInterval(refresh,350)});
</script>
</body>
</html>
